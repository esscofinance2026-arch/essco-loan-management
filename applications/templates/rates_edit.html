<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Interest Rate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8fafc;
            color: #1a202c;
            padding: 30px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 30px 35px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9ecef;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f7fafc;
        }

        .header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a202c;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h2 i {
            color: #667eea;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge.active {
            background: #c6f6d5;
            color: #276749;
        }

        .badge.inactive {
            background: #fed7d7;
            color: #9b2c2c;
        }

        .badge .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .badge.active .dot { background: #48bb78; }
        .badge.inactive .dot { background: #fc8181; }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #2d3748;
            margin-bottom: 4px;
        }

        .form-group label .req {
            color: #fc8181;
            margin-left: 2px;
        }

        .form-group .help {
            font-size: 0.8rem;
            color: #a0aec0;
            margin-top: 4px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.25s;
            background: white;
            font-family: inherit;
        }

        .form-control:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 70px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .form-check input {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
            cursor: pointer;
        }

        .form-check label {
            font-weight: 600;
            color: #2d3748;
            cursor: pointer;
            margin: 0;
        }

        .form-actions {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f7fafc;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            font-family: inherit;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd6;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.3);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .btn-danger {
            background: #fc8181;
            color: white;
        }

        .btn-danger:hover {
            background: #f56565;
        }

        .alert {
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #c6f6d5;
            color: #276749;
            border: 1px solid #9ae6b4;
        }

        .alert-error {
            background: #fed7d7;
            color: #9b2c2c;
            border: 1px solid #feb2b2;
        }

        @media (max-width: 768px) {
            body { padding: 15px 10px; }
            .container { padding: 20px; }
            .form-row { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; }
            .form-actions { flex-direction: column; }
            .form-actions .btn { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2><i class="fas fa-edit"></i> Edit Interest Rate</h2>
            {% if LogInfo %}
            <span class="badge {% if LogInfo.is_active %}active{% else %}inactive{% endif %}">
                <span class="dot"></span>
                {% if LogInfo.is_active %}Active{% else %}Inactive{% endif %}
            </span>
            {% endif %}
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-row">
                <div class="form-group">
                    <label>Name <span class="req">*</span></label>
                    {{ form.name }}
                </div>
                <div class="form-group">
                    <label>Rate (%) <span class="req">*</span></label>
                    {{ form.rate }}
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Min Amount <span class="req">*</span></label>
                    {{ form.min_loan_amount }}
                </div>
                <div class="form-group">
                    <label>Max Amount</label>
                    {{ form.max_loan_amount }}
                </div>
            </div>

            <div class="form-group">
                <div class="form-check">
                    {{ form.is_active }}
                    <label for="{{ form.is_active.id_for_label }}">Active</label>
                </div>
            </div>

            <div class="form-group">
                <label>Notes</label>
                {{ form.notes }}
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <a href="{% url 'rates' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
                {% if LogInfo %}
                <a href="" class="btn btn-danger" onclick="return confirm('Delete this rate?')">
                    <i class="fas fa-trash"></i> Delete
                </a>
                {% endif %}
            </div>
        </form>
    </div>

</body>
</html>
