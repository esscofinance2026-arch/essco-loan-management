{% extends 'Appbase.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/storelocator.css' %}">
{% endblock %}

{% block content %}
<div class="store-locator-wrapper">
    <div class="locator-container">
        <!-- Map Section -->
        <div class="map-section" id="mapContainer">
            <iframe 
                id="storeMap"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12345.6789!2d-59.5868474!3d13.0912921!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTPCsDA1JzI4LjciTiA1OcKwMzUnMTIuNSJX!5e0!3m2!1sen!2sbb!4v1234567890"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>

            <div class="map-controls">
                <button onclick="zoomMap('in')" title="Zoom in">
                    <i class="fas fa-plus"></i>
                </button>
                <button onclick="zoomMap('out')" title="Zoom out">
                    <i class="fas fa-minus"></i>
                </button>
            </div>

            <div class="map-logo">
                <span>Google</span>
            </div>
        </div>

        <!-- Location List -->
        <div class="location-list">
            <!--
            <div class="store-header">
                <h2><span id="storeCount">1</span> Stores</h2>
            </div>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search stores...">
            </div> -->

            <div class="store-items" id="storeList">
                <!-- Category: Online -->
                <div class="store-category">Online</div>

                <!-- Electric Sales & Service Ltd -->
                <div class="store-item" data-lat="13.0912921" data-lng="-59.5868474" data-store="Electric Sales & Service Ltd">
                    <div class="store-name">
                        <i class="fas fa-store" style="color: #cc0000;"></i>
                        Electric Sales & Service Ltd
                    </div>
                    <div class="store-address">
                        <i class="fas fa-map-marker-alt"></i>
                        Clapham Cl, Wildey Main Road, Saint Michael
                    </div>
                    <div class="store-actions">
                        <a href="#" class="direction-link" data-lat="13.0912921" data-lng="-59.5868474" data-store="Electric Sales & Service Ltd">
                            <i class="fas fa-map-pin"></i> View on Map
                        </a>
                        <a href="https://www.google.com/maps/dir/13.0916581,-59.5869623/Electric+Sales+%26+Service+Ltd,+Clapham+Cl,+Wildey+Main+Road,+Saint+Michael+Barbados/@13.0914824,-59.5893259,17z/data=!3m1!4b1!4m17!1m7!3m6!1s0x8c43f692a99f3d51:0xe5c10f1a45292c54!2sElectric+Sales+%26+Service+Ltd!8m2!3d13.0912921!4d-59.5868474!16s%2Fg%2F11c5bky7h9!4m8!1m1!4e1!1m5!1m1!1s0x8c43f692a99f3d51:0xe5c10f1a45292c54!2m2!1d-59.5868474!2d13.0912921?entry=ttu&g_ep=EgoyMDI2MDYyMy4wIKXMDSoASAFQAw%3D%3D"
                        class="direction-link" data-lat="13.0761" data-lng="-59.6117" data-store="Radioshack Sheraton">
                            <i class="fas fa-map-pin"></i> View on Map
                        </a>
                    </div>
                </div>

                <!-- No Results -->
                <div class="no-results" id="noResults" style="display: none;">
                    <i class="fas fa-store-slash"></i>
                    <p>No stores found</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // ===== MAP INTERACTION =====

    // 1. Click "View on Map" to highlight location on the map
    document.querySelectorAll('.direction-link').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const lat = this.dataset.lat;
            const lng = this.dataset.lng;
            const storeName = this.dataset.store;
            
            // Find the parent store item and highlight it
            const parentItem = this.closest('.store-item');
            if (parentItem) {
                // Remove active class from all
                document.querySelectorAll('.store-item').forEach(el => {
                    el.classList.remove('active');
                });
                // Add active class to this store
                parentItem.classList.add('active');
            }
            
            // Update the map iframe with new coordinates
            updateMap(lat, lng, storeName);
            
            // Show a notification
            showNotification(`📍 Showing: ${storeName}`);
        });
    });

    // 2. Update map function
    function updateMap(lat, lng, storeName) {
        const iframe = document.getElementById('storeMap');
        if (!iframe) return;
        
        // Get the current src
        const currentSrc = iframe.src;
        
        // Extract the base URL (everything before the coordinates)
        let baseUrl;
        if (currentSrc.includes('!2z')) {
            // If it has coordinates already, replace them
            const parts = currentSrc.split('!2z');
            baseUrl = parts[0];
        } else {
            // Otherwise use the current src as base
            baseUrl = currentSrc.split('!2m3!')[0];
        }
        
        // Build new URL with updated coordinates
        // Format: latitude,longitude
        const newSrc = `${baseUrl}!2m3!1f0!2f0!3f0!2m3!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2z${lat}%2C${lng}!5e0!3m2!1sen!2sbb!4v${Date.now()}`;
        
        iframe.src = newSrc;
        
        // Also update any marker overlay if you have one
        updateMarker(lat, lng, storeName);
    }

    // 3. Show notification
    function showNotification(message) {
        const existing = document.querySelector('.map-notification');
        if (existing) existing.remove();
        
        const notification = document.createElement('div');
        notification.className = 'map-notification';
        notification.textContent = message;
        
        const mapSection = document.getElementById('mapContainer');
        if (mapSection) {
            mapSection.style.position = 'relative';
            mapSection.appendChild(notification);
        }
        
        setTimeout(() => {
            notification.style.opacity = '0';
            notification.style.transition = 'opacity 0.5s ease';
            setTimeout(() => notification.remove(), 500);
        }, 2500);
    }

    // 4. Optional: Update a custom marker on the map
    function updateMarker(lat, lng, storeName) {
        // If you're using a custom map with markers, update it here
        // For Google Maps iframe, the URL update handles this
        console.log(`📍 ${storeName}: ${lat}, ${lng}`);
    }

    // 5. Click store item to highlight on map (existing functionality)
    document.querySelectorAll('.store-item').forEach(item => {
        item.addEventListener('click', function(e) {
            // Don't trigger if clicking on a link inside
            if (e.target.closest('a')) return;
            
            // Remove active class from all
            document.querySelectorAll('.store-item').forEach(el => {
                el.classList.remove('active');
            });
            // Add active class to clicked
            this.classList.add('active');
            
            const lat = this.dataset.lat;
            const lng = this.dataset.lng;
            const storeName = this.dataset.store;
            
            updateMap(lat, lng, storeName);
            showNotification(`📍 Showing: ${storeName}`);
        });
    });

    // 6. Search functionality
    document.getElementById('searchInput').addEventListener('input', function() {
        const searchTerm = this.value.toLowerCase().trim();
        const items = document.querySelectorAll('.store-item');
        const categories = document.querySelectorAll('.store-category');
        let visibleCount = 0;
        
        categories.forEach(cat => cat.style.display = 'none');
        
        items.forEach(item => {
            const text = item.textContent.toLowerCase();
            if (text.includes(searchTerm) || searchTerm === '') {
                item.style.display = 'flex';
                visibleCount++;
                const prev = item.previousElementSibling;
                if (prev && prev.classList.contains('store-category')) {
                    prev.style.display = 'block';
                }
            } else {
                item.style.display = 'none';
            }
        });
        
        document.getElementById('storeCount').textContent = visibleCount;
        document.getElementById('noResults').style.display = (visibleCount === 0 && searchTerm !== '') ? 'block' : 'none';
    });

    // 7. Zoom controls
    function zoomMap(action) {
        const iframe = document.getElementById('storeMap');
        // Simple implementation - you can enhance this
        alert('Use the map controls to zoom in/out');
    }

    // 8. Street View links
    document.querySelectorAll('.street-view-link').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const lat = this.dataset.lat;
            const lng = this.dataset.lng;
            // Open Google Maps Street View in new tab
            window.open(`https://www.google.com/maps?q=${lat},${lng}&layer=c&cbll=${lat},${lng}`, '_blank');
        });
    });

    // 9. Auto-select first store on load
    document.addEventListener('DOMContentLoaded', function() {
        const firstStore = document.querySelector('.store-item');
        if (firstStore) {
            setTimeout(() => {
                firstStore.click();
            }, 500);
        }
    });
</script>
{% endblock %}
